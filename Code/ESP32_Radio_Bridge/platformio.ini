; MecanumB ESP32 radio bridge.
; Build:  ~/.venvs/mecanum-esp32/bin/pio run -d Code/ESP32_Radio_Bridge
; Upload: ~/.venvs/mecanum-esp32/bin/pio run -d Code/ESP32_Radio_Bridge -t upload
;
; The MAVLink C library is used in place from the firmware tree, so there is
; no registry dependency and both images share exactly the same dialect.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -I${PROJECT_DIR}/../MecanumB_Control/Middlewares/Third_Party/MAVLink
    -DBRIDGE_UART_RX=16
    -DBRIDGE_UART_TX=17
    -DBRIDGE_UART_BAUD=921600
    -DBRIDGE_SBUS_ENABLED=1
    -DBRIDGE_SBUS_RX=4
    -DBRIDGE_UDP_PORT=14550
    -DBRIDGE_SYSID=2
    -DBRIDGE_COMPID=68
    ; Empty SSID starts the fallback access point. Set these to join the Pi
    ; hotspot instead, e.g. -DBRIDGE_WIFI_SSID=\"mecanum\".
    -DBRIDGE_WIFI_SSID=\"\"
    -DBRIDGE_WIFI_PASS=\"\"
    -DBRIDGE_AP_SSID=\"MecanumB-Bridge\"
    -DBRIDGE_AP_PASS=\"mecanum123\"
